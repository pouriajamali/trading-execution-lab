name: CSharp synthetic invariants
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  test:
    name: Execution02 native (${{ matrix.rid }})
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    # Preserve exact committed source/common proof bytes on either OS.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      # Same preinstalled Python and signed own-source policy; no new tool setup.
      - name: Own typed CI host and bounded native row
        shell: pwsh
        run: |
          if ($IsWindows) {
            $candidates = @(
              (Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.12.10/x64/python.exe'),
              (Get-Command python -ErrorAction SilentlyContinue).Source
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
            $python = $candidates | Where-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() -eq '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a' } | Select-Object -First 1
            if (-not $python) { throw 'Existing admitted Python3.12.10 unavailable; no bootstrap fallback' }
          } else {
            $python = '/usr/bin/python3.12'
            if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Existing Python3.12 unavailable' }
          }
          & $python -I -B scripts/run_bounded.py --ci --ci-rid '${{ matrix.rid }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: tested-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/build/archive.json
            artifacts/runtime probe with spaces/receipt.json
            artifacts/launcher/receipt.json
            ${{ runner.temp }}/execution02-*/consumer-terminal.json
            ${{ runner.temp }}/execution02-*/containment.json
            ${{ runner.temp }}/execution02-*/context.json
            ${{ runner.temp }}/execution02-*/host-handshake.json
            ${{ runner.temp }}/execution02-*/root-terminal.json
            ${{ runner.temp }}/execution02-*/own-caps.json
            ${{ runner.temp }}/execution02-*/consumer-admission.json
            ${{ runner.temp }}/execution02-*/normal-context.json
            ${{ runner.temp }}/execution02-*/normal-input.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify the already-executed archives without rebuilding
        run: python scripts/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Archive source and checksum all three archives
        shell: bash
        run: |
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --prefix="trading-execution-lab-${RELEASE_TAG}-source/" --output="artifacts/release/trading-execution-lab-${RELEASE_TAG}-source.zip" HEAD
          cd artifacts/release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Stage tested preview assets in a draft (operator signing required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft --prerelease --title "$RELEASE_TAG — .NET 11 local operator panel" --notes-file docs/RELEASE-v0.6.0-preview.1.md
