name: CSharp synthetic invariants
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  test:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: OperatorPanel/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the operator protocol and C# invariants
        shell: pwsh
        run: |
          npm --prefix OperatorPanel ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix OperatorPanel test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ExecutionLab.Tests/ExecutionLab.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check launcher exit, environment and owned cleanup
        run: python scripts/check_launcher.py --work artifacts/launcher
      - name: Build exact-commit framework-dependent package
        run: python scripts/package_panel.py --work artifacts/build --out artifacts/delivery --rid ${{ matrix.rid }} --commit ${{ github.sha }}
      - name: Extract actual archive to a path with spaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/extracted package' -ErrorAction Stop | Out-Null
          $archive = Get-ChildItem -LiteralPath artifacts/delivery -File
          if (@($archive).Count -ne 1) { throw 'One exact tested archive required.' }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'artifacts/extracted package' }
          else { tar -xzf $archive.FullName -C 'artifacts/extracted package'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Execute extracted package against real HTTP and SQLite
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath 'artifacts/extracted package' -Directory
          if (@($package).Count -ne 1) { throw 'One package root required.' }
          python scripts/check_package.py --package $package.FullName --work 'artifacts/runtime probe with spaces' --commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: tested-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/build/archive.json
            artifacts/runtime probe with spaces/receipt.json
            artifacts/launcher/receipt.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify the already-executed archives without rebuilding
        run: python scripts/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Archive source and checksum all three archives
        shell: bash
        run: |
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --prefix="trading-execution-lab-${RELEASE_TAG}-source/" --output="artifacts/release/trading-execution-lab-${RELEASE_TAG}-source.zip" HEAD
          cd artifacts/release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish tested preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG — runtime-preflight local operator panel" --notes-file docs/RELEASE-v0.5.2-preview.1.md
