name: CSharp synthetic invariants
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project ExecutionLab.Tests/ExecutionLab.Tests.csproj --configuration Release
      - name: Reproduce bounded measurement contract
        run: dotnet run --project ExecutionLab.Measurements/ExecutionLab.Measurements.csproj --configuration Release -- --output artifacts/measurement
      - uses: actions/upload-artifact@v4
        with:
          name: measurement-${{ matrix.os }}
          path: artifacts/measurement/
          if-no-files-found: error
